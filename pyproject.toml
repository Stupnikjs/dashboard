[project]
name = "dashboard"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "pyarrow",
    "plotly",
    "streamlit",
    "yfinance",
    "curl_cffi",
]

[project.scripts]
dashboard-ingest = "ingestion.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]